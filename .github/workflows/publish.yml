name: publish

# Tag-triggered npm publish with sigstore provenance, authenticated via
# Trusted Publishing (OIDC). No long-lived NPM_TOKEN secret required —
# npm verifies the workflow's GitHub-issued OIDC token against the trusted
# publisher record at npmjs.com/package/token-ops/access.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # id-token: write — required for Trusted Publishing OIDC + sigstore provenance.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing requires npm >= 11.5 (Node 20 ships npm 10.x).
      - run: npm install -g npm@latest

      - name: Run tests on the tagged commit
        run: npm test

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
